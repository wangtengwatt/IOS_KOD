<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KOD iOS 17 手动测试台</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
        background: #07090f;
        color: #f6f7fb;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: auto;
        background:
          radial-gradient(circle at 20% 18%, rgba(80, 111, 255, .20), transparent 32rem),
          radial-gradient(circle at 82% 76%, rgba(147, 51, 234, .18), transparent 34rem),
          #07090f;
      }

      .stage {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(250px, 340px) auto;
        gap: clamp(32px, 7vw, 100px);
        align-items: center;
        justify-content: center;
        padding: 34px 42px;
      }

      .panel { max-width: 340px; }
      .eyebrow {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        padding: 7px 11px;
        border: 1px solid rgba(255,255,255,.13);
        border-radius: 999px;
        background: rgba(255,255,255,.055);
        color: #b9c3ff;
        font-size: 12px;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: #52e29a; box-shadow: 0 0 14px #52e29a; }
      h1 { margin: 20px 0 12px; font-size: clamp(32px, 4vw, 52px); line-height: .98; letter-spacing: -.055em; }
      .lead { margin: 0 0 26px; color: #9ba3b7; line-height: 1.65; font-size: 14px; }
      .devices { display: grid; gap: 9px; }
      .device-button {
        width: 100%;
        border: 1px solid rgba(255,255,255,.10);
        border-radius: 14px;
        padding: 12px 14px;
        color: #d8dbea;
        background: rgba(255,255,255,.045);
        text-align: left;
        cursor: pointer;
        transition: .18s ease;
      }
      .device-button:hover { border-color: rgba(143,157,255,.52); transform: translateY(-1px); }
      .device-button.active { border-color: #8f9dff; background: rgba(105,120,255,.15); box-shadow: 0 8px 30px rgba(47,60,170,.18); }
      .device-button strong { display: block; font-size: 13px; }
      .device-button span { color: #858da3; font-size: 11px; }
      .hint { margin-top: 18px; color: #666f84; font-size: 11px; line-height: 1.55; }

      .device-wrap { display: grid; place-items: center; }
      .device {
        --screen-width: 393px;
        --screen-height: 852px;
        --radius: 56px;
        position: relative;
        width: calc(var(--screen-width) + 22px);
        height: calc(var(--screen-height) + 22px);
        padding: 11px;
        border-radius: calc(var(--radius) + 10px);
        background: linear-gradient(145deg, #777b85 0%, #17191f 12%, #030408 47%, #555a65 88%, #111318 100%);
        box-shadow: 0 42px 100px rgba(0,0,0,.64), 0 0 0 1px rgba(255,255,255,.24), inset 0 0 0 1px rgba(0,0,0,.85);
        transition: width .25s ease, height .25s ease, border-radius .25s ease;
      }
      .device::before, .device::after {
        content: "";
        position: absolute;
        left: -4px;
        width: 4px;
        border-radius: 3px 0 0 3px;
        background: #252932;
      }
      .device::before { top: 145px; height: 74px; }
      .device::after { top: 232px; height: 74px; }
      .screen {
        position: relative;
        width: var(--screen-width);
        height: var(--screen-height);
        overflow: hidden;
        border-radius: var(--radius);
        background: #fff;
        transition: width .25s ease, height .25s ease, border-radius .25s ease;
      }
      iframe { position: absolute; inset: 48px 0 0; width: 100%; height: calc(100% - 48px); border: 0; background: #fff; }
      .statusbar {
        pointer-events: none;
        position: absolute;
        z-index: 5;
        inset: 0 0 auto;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 22px;
        color: #f8f9fc;
        background: rgba(13, 14, 18, .97);
        font-size: 11px;
        font-weight: 700;
        text-shadow: none;
      }
      .status-right { display: flex; align-items: center; gap: 5px; }
      .signal { letter-spacing: -2px; font-size: 12px; }
      .battery { width: 20px; height: 10px; border: 1.4px solid currentColor; border-radius: 3px; padding: 1.5px; position: relative; }
      .battery::before { content: ""; display: block; height: 100%; width: 76%; border-radius: 1px; background: currentColor; }
      .battery::after { content: ""; position: absolute; right: -3.5px; top: 2px; width: 2px; height: 4px; border-radius: 0 2px 2px 0; background: currentColor; opacity: .5; }
      .island { pointer-events: none; position: absolute; z-index: 6; top: 7px; left: 50%; width: 126px; height: 35px; transform: translateX(-50%); border-radius: 22px; background: #000; box-shadow: 0 1px 0 rgba(255,255,255,.12); }
      .home { pointer-events: none; position: absolute; z-index: 6; bottom: 8px; left: 50%; width: 132px; height: 5px; transform: translateX(-50%); border-radius: 99px; background: rgba(0,0,0,.74); box-shadow: 0 0 4px rgba(255,255,255,.45); }
      .device-label { margin-top: 18px; color: #737c91; font-size: 12px; letter-spacing: .04em; text-align: center; }

      .device[data-model="se"] { --screen-width: 375px; --screen-height: 667px; --radius: 40px; }
      .device[data-model="se"] .island { width: 104px; height: 25px; top: 8px; border-radius: 0 0 15px 15px; }
      .device[data-model="ipad"] { --screen-width: 834px; --screen-height: 1194px; --radius: 32px; transform: scale(.66); margin: -203px -142px; }
      .device[data-model="ipad"] .island { width: 12px; height: 12px; top: 13px; border-radius: 50%; }
      .device[data-model="ipad"] .home { display: none; }

      @media (max-width: 820px) {
        .stage { grid-template-columns: 1fr; padding: 24px 12px 40px; }
        .panel { max-width: 420px; }
        .device { transform: scale(.84); margin: -70px 0; }
        .device[data-model="ipad"] { transform: scale(.43); margin: -335px -240px; }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <section class="panel">
        <div class="eyebrow"><span class="dot"></span> Local manual test</div>
        <h1>KOD<br />iOS 17</h1>
        <p class="lead">应用运行在设备框内部。可直接点击、输入和切换页面；左侧可检查 iPhone 与 iPad 响应式布局。</p>
        <div class="devices">
          <button class="device-button active" data-model="iphone" data-name="iPhone 15 Pro · iOS 17"><strong>iPhone 15 Pro</strong><span>393 × 852 · iOS 17</span></button>
          <button class="device-button" data-model="se" data-name="iPhone SE · iOS 17"><strong>iPhone SE</strong><span>375 × 667 · iOS 17</span></button>
          <button class="device-button" data-model="ipad" data-name="iPad Pro 11-inch · iPadOS 17"><strong>iPad Pro 11-inch</strong><span>834 × 1194 · iPadOS 17</span></button>
        </div>
        <p class="hint">这是浏览器中的布局测试台。StoreKit、Keychain、原生通知、Universal Link 和 Swift 插件仍需 iPhone/Xcode 验证。</p>
      </section>

      <section class="device-wrap">
        <div class="device" id="device" data-model="iphone">
          <div class="screen">
            <iframe id="app" title="KOD iOS application" src="http://127.0.0.1:4173/"></iframe>
            <div class="statusbar"><span>iOS 17</span><span class="status-right"><span class="signal">▂▄▆█</span><span>5G</span><span class="battery"></span></span></div>
            <div class="island"></div>
            <div class="home"></div>
          </div>
        </div>
        <div class="device-label" id="device-label">iPhone 15 Pro · iOS 17 · KOD preview build</div>
      </section>
    </main>
    <script>
      const device = document.querySelector('#device')
      const label = document.querySelector('#device-label')
      document.querySelectorAll('.device-button').forEach((button) => {
        button.addEventListener('click', () => {
          document.querySelectorAll('.device-button').forEach((item) => item.classList.remove('active'))
          button.classList.add('active')
          device.dataset.model = button.dataset.model
          label.textContent = `${button.dataset.name} · KOD preview build`
        })
      })
    </script>
  </body>
</html>
